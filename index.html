<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows 95 PC Online</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        #toolbar {
            height: 40px;
            background: #222;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            font-family: sans-serif;
            font-size: 14px;
            border-bottom: 1px solid #444;
            z-index: 10;
        }
        #toolbar button {
            background: #0078d7;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        #toolbar button:hover {
            background: #005a9e;
        }
        #game {
            width: 100%;
            height: calc(100vh - 40px);
        }
    </style>
</head>
<body>

    <div id="toolbar">
        <span>🖥️ <b>Windows 95 PC Online</b></span>
        <button onclick="toggleFullscreen()">Toggle Fullscreen (F11)</button>
    </div>

    <div id="game"></div>

    <script>
        EJS_player = "#game";
        EJS_core = "dosbox";
        EJS_gameName = "Windows 95";
        EJS_color = "#0078d7";
        EJS_virtualGamepad = false;
        EJS_url = "https://cdn.jsdelivr.net/gh/dreamlayers/emulators-ui@master/demos/win95.zip"; 
        EJS_pathtodata = "https://cdn.jsdelivr.net/gh/EmulatorJS/EmulatorJS@latest/data/";
    </script>
    <script src="https://cdn.jsdelivr.net/gh/EmulatorJS/EmulatorJS@latest/data/loader.js"></script>

    <script>
        function toggleFullscreen() {
            const elem = document.documentElement;
            if (!document.fullscreenElement) {
                if (elem.requestFullscreen) {
                    elem.requestFullscreen();
                } else if (elem.webkitRequestFullscreen) {
                    elem.webkitRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }
    </script>

</body>
</html>
