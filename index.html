<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows 95 PC Online</title>
    
    <!-- Nhúng emulators và emulators-ui từ unpkg -->
    <script src="https://unpkg.com/emulators@7.5.8/dist/emulators.js"></script>
    <script src="https://unpkg.com/emulators-ui@7.5.8/dist/emulators-ui.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/emulators-ui@7.5.8/dist/emulators-ui.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        #toolbar {
            height: 40px;
            background: #222;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            font-family: sans-serif;
            font-size: 14px;
            border-bottom: 1px solid #444;
        }
        #toolbar button {
            background: #0078d7;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        #toolbar button:hover {
            background: #005a9e;
        }
        #app {
            width: 100vw;
            height: calc(100vh - 40px);
        }
    </style>
</head>
<body>

    <div id="toolbar">
        <span>🖥️ <b>Windows 95 PC Online</b></span>
        <button onclick="toggleFullscreen()">Phóng to Toàn màn hình (F11)</button>
    </div>

    <div id="app"></div>

    <script>
        // Cấu hình đường dẫn cho emulators
        emulators.pathPrefix = "https://unpkg.com/emulators@7.5.8/dist/";

        // Khởi tạo Windows 95 đúng chuẩn cấu trúc của emulators-ui
        emulators.loadCanvas(document.getElementById("app")).then(async (ci) => {
            await ci.start({
                url: "https://v8.js-dos.com/win95.jsdos",
            });
        });

        function toggleFullscreen() {
            const elem = document.getElementById("app");
            if (!document.fullscreenElement) {
                if (elem.requestFullscreen) {
                    elem.requestFullscreen();
                } else if (elem.webkitRequestFullscreen) {
                    elem.webkitRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }
    </script>

</body>
</html>
