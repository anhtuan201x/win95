<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows 95 trên Trình duyệt (DOSBox)</title>
    <!-- Nhúng CSS và JS của js-dos v7 -->
    <script src="https://js-dos.com/v7/build/js-dos.js"></script>
    <link rel="stylesheet" href="https://js-dos.com/v7/build/js-dos.css">
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h2 {
            margin-bottom: 10px;
        }
        #app {
            width: 700px;
            height: 500px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border-radius: 8px;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <h2>Windows 95 Emulator (DOSBox)</h2>
    <div id="app"></div>

    <script>
        // Khởi tạo js-dos chạy file cấu hình Windows 95 từ CDN
        Dos(document.getElementById("app"), {
            url: "https://js-dos.com/cdn/win95.jsdos",
        });
    </script>

</body>
</html>
